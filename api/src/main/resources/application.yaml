app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${ACCESS_TOKEN_EXPIRATION:15m}
    refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:7d}

  cookie:
    secure: ${COOKIE_SECURE:false}

server:
  port: 8000
  servlet:
    context-path: /api/v1

spring:
  application:
    name: api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  devtools:
    livereload:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:/db/migration
  jpa:
    hibernate:
      ddl-auto: none