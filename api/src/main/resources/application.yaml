server:
  port: 8000

spring:
  application:
    name: api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  devtools:
    livereload:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:/db/migration
  jpa:
    hibernate:
      ddl-auto: none